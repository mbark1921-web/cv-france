name: CV France CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Syntax checks
        run: for f in server/*.js; do node --check "$f"; done
      - name: Patch public app twice
        run: npm run patch:public && npm run patch:public
      - name: Verify final CV renderer and styles are injected once
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const r=(s.match(/CV_FINAL_RENDERER_V20_2/g)||[]).length;const c=(s.match(/CV_FINAL_POLISH_STYLES_V20_2/g)||[]).length;if(r!==1||c!==1)throw new Error('renderer='+r+', styles='+c);"
      - name: Verify RTL preview and PDF preview-only print
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');if(!s.includes(\"box.dir=lang==='ar'?'rtl':'ltr'\"))throw new Error('RTL preview direction missing');if(!s.includes('body *{visibility:hidden!important}'))throw new Error('global print hiding missing');if(!s.includes('#cvPreview,#cvPreview *{visibility:visible!important}'))throw new Error('preview print visibility missing');if(!s.includes(\"#cvPreview[dir='rtl'] h1\"))throw new Error('RTL print alignment missing');"
      - name: Verify production version consistency
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const server=fs.readFileSync('server/index.js','utf8');const html=fs.readFileSync('public/index.html','utf8');const render=fs.readFileSync('render.yaml','utf8');if(!server.includes('version: \"'+pkg.version+'\"'))throw new Error('health version mismatch');if(!html.includes('v'+pkg.version+' Production'))throw new Error('visible production version mismatch');if(!html.includes('version officielle v'+pkg.version+'.'))throw new Error('French production copy mismatch');if(!html.includes('النسخة الرسمية v'+pkg.version+'.'))throw new Error('Arabic production copy mismatch');if(!render.includes('value: production'))throw new Error('production stage missing');if(!render.includes('plan: free'))throw new Error('free hosting plan changed');"
      - name: Generate PostgreSQL server
        run: npm run build:pg
      - name: Check generated PostgreSQL server
        run: node --check server/index.pg.generated.js
      - name: Verify PostgreSQL package
        run: npm ls pg
