name: CV France CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Syntax checks
        run: for f in server/*.js; do node --check "$f"; done
      - name: Patch public app twice
        run: npm run patch:public && npm run patch:public
      - name: Verify final CV renderer and styles are injected once
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('public/index.html','utf8');const r=(s.match(/CV_FINAL_RENDERER_V20_2/g)||[]).length;const c=(s.match(/CV_FINAL_POLISH_STYLES_V20_2/g)||[]).length;if(r!==1||c!==1)throw new Error('renderer='+r+', styles='+c);"
      - name: Verify version consistency
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));const server=fs.readFileSync('server/index.js','utf8');const html=fs.readFileSync('public/index.html','utf8');const short=pkg.version.split('.').slice(0,2).join('.');if(!server.includes('version: \"'+pkg.version+'\"'))throw new Error('health version mismatch');if(!html.includes('v'+short+' Staging'))throw new Error('visible version mismatch');"
      - name: Generate PostgreSQL server
        run: npm run build:pg
      - name: Check generated PostgreSQL server
        run: node --check server/index.pg.generated.js
      - name: Verify PostgreSQL package
        run: npm ls pg
