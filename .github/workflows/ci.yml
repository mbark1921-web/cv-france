name: CV France CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: test
      APP_STAGE: test
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies including test tools
        run: npm ci --include=dev
      - name: Install isolated PostgreSQL and TLS test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16 openssl
          # Debian's native binaries use this socket directory, including isolated clusters.
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /var/run/postgresql
      - name: Install locked Playwright Chromium and OS dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Run complete release gate
        run: npm run test:ci
      - name: Check whitespace
        run: git diff --check
