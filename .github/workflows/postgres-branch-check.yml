name: PostgreSQL branch check

on:
  push:
    branches:
      - feat/supabase-postgres
  workflow_dispatch:

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Generate PostgreSQL server
        run: npm run build:pg

      - name: Check generated server syntax
        run: node --check server/index.pg.generated.js

      - name: Check database adapter syntax
        run: node --check server/db.js

      - name: Check auth middleware syntax
        run: node --check server/auth.js
