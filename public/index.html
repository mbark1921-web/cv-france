<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV France v20</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><style>body{font-family:Arial;margin:0;background:#f6f7f9;color:#18212f}header{background:#111827;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:20px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}.nav button{background:#fff}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.ok{background:#e8fff3;padding:10px;border-radius:8px}.err{background:#ffe9e9;padding:10px;border-radius:8px}.muted{color:#667085}.primary{background:#111827;color:#fff}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><header><h2>CV France <small>v20 Staging</small></h2><div class="nav"><button onclick="show('home')">Accueil</button><button onclick="show('account')">Compte</button><button onclick="show('cv')">CV</button><button onclick="show('letters')">Lettres</button><button onclick="show('apps')">Candidatures</button><button onclick="show('feedback')">Feedback</button></div></header><main><div id="banner"></div><section id="home"><div class="card"><h1>Votre recherche d'emploi, organisée.</h1><p class="muted">Créez vos CV, lettres et suivez vos candidatures. Cette page est la version staging v20.</p><p>État serveur: <strong id="health">chargement…</strong></p></div></section><section id="account" class="hidden"><div class="grid"><div class="card"><h3>Créer un compte</h3><input id="regEmail" placeholder="E-mail"><input id="regPass" type="password" placeholder="Mot de passe"><input id="regInvite" placeholder="Code invitation"><button class="primary" onclick="register()">Créer</button></div><div class="card"><h3>Connexion</h3><input id="logEmail" placeholder="E-mail"><input id="logPass" type="password" placeholder="Mot de passe"><button class="primary" onclick="login()">Connexion</button><button onclick="logout()">Déconnexion</button><p id="me" class="muted"></p></div></div></section><section id="cv" class="hidden"><div class="card"><h3>CV</h3><input id="cvTitle" placeholder="Nom du CV"><input id="cvRole" placeholder="Métier recherché"><textarea id="cvProfile" placeholder="Profil professionnel"></textarea><textarea id="cvExperience" placeholder="Expériences"></textarea><textarea id="cvSkills" placeholder="Compétences"></textarea><button class="primary" onclick="saveCv()">Enregistrer</button><div id="cvList"></div></div></section><section id="letters" class="hidden"><div class="card"><h3>Lettre</h3><input id="letterTitle" placeholder="Titre"><input id="letterCompany" placeholder="Entreprise"><input id="letterRole" placeholder="Poste"><textarea id="letterContent" placeholder="Contenu"></textarea><button class="primary" onclick="saveLetter()">Enregistrer</button><div id="letterList"></div></div></section><section id="apps" class="hidden"><div class="card"><h3>Candidature</h3><input id="appCompany" placeholder="Entreprise"><input id="appRole" placeholder="Poste"><select id="appStatus"><option>Envoyée</option><option>Entretien</option><option>Relance</option><option>Refus</option><option>Acceptée</option></select><button class="primary" onclick="saveApp()">Ajouter</button><div id="appList"></div></div></section><section id="feedback" class="hidden"><div class="card"><h3>Feedback bêta</h3><select id="fbRating"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><select id="fbCategory"><option value="general">Général</option><option value="bug">Bug</option><option value="idea">Idée</option><option value="design">Design</option><option value="payment">Paiement</option><option value="ai">IA</option></select><textarea id="fbMessage" placeholder="Votre retour"></textarea><button class="primary" onclick="sendFeedback()">Envoyer</button></div></section></main><script>const A='/api';let token=localStorage.getItem('cvf_token')||'';const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),H=()=>token?{Authorization:'Bearer '+token}:{};function show(id){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');if(id==='cv')loadCvs();if(id==='letters')loadLetters();if(id==='apps')loadApps()}function note(t,e=false){banner.className=e?'err':'ok';banner.textContent=t;setTimeout(()=>banner.textContent='',4000)}async function health(){try{let r=await fetch(A+'/health'),d=await r.json();$('health').textContent=d.ok?'OK v'+d.version:'Erreur'}catch{$('health').textContent='indisponible'}}async function register(){let r=await fetch(A+'/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v('regEmail'),password:v('regPass'),inviteCode:v('regInvite')})}),d=await r.json();if(!r.ok)return note(d.error,true);token=d.token;localStorage.setItem('cvf_token',token);note('Compte créé. Vérifiez votre e-mail.');me()}async function login(){let r=await fetch(A+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v('logEmail'),password:v('logPass')})}),d=await r.json();if(!r.ok)return note(d.error,true);token=d.token;localStorage.setItem('cvf_token',token);note('Connecté');me()}function logout(){token='';localStorage.removeItem('cvf_token');$('me').textContent='Non connecté'}async function me(){if(!token)return;let r=await fetch(A+'/me',{headers:H()});if(!r.ok)return logout();let d=await r.json();$('me').textContent=d.user.email+' — '+d.user.plan}async function saveCv(){let body={title:v('cvTitle')||'Mon CV',targetRole:v('cvRole'),data:{jobTitle:v('cvRole'),profile:v('cvProfile'),experience:v('cvExperience'),skills:v('cvSkills')}};let r=await fetch(A+'/cvs',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return note(d.error,true);note('CV enregistré');loadCvs()}async function loadCvs(){if(!token)return;$('cvList').innerHTML='';let r=await fetch(A+'/cvs',{headers:H()}),d=await r.json();if(r.ok)$('cvList').innerHTML=d.cvs.map(x=>'<p><b>'+x.title+'</b> — '+(x.target_role||'')+'</p>').join('')}async function saveLetter(){let body={title:v('letterTitle')||'Lettre',company:v('letterCompany'),targetRole:v('letterRole'),content:v('letterContent')};let r=await fetch(A+'/letters',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return note(d.error,true);note('Lettre enregistrée');loadLetters()}async function loadLetters(){if(!token)return;let r=await fetch(A+'/letters',{headers:H()}),d=await r.json();if(r.ok)$('letterList').innerHTML=d.letters.map(x=>'<p><b>'+x.title+'</b> — '+(x.company||'')+'</p>').join('')}async function saveApp(){let body={company:v('appCompany'),role:v('appRole'),status:v('appStatus')};let r=await fetch(A+'/applications',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return note(d.error,true);note('Candidature ajoutée');loadApps()}async function loadApps(){if(!token)return;let r=await fetch(A+'/applications',{headers:H()}),d=await r.json();if(r.ok)$('appList').innerHTML=d.applications.map(x=>'<p><b>'+x.company+'</b> — '+x.role+' — '+x.status+'</p>').join('')}async function sendFeedback(){let body={rating:Number(v('fbRating')),category:v('fbCategory'),message:v('fbMessage'),page:location.pathname};let r=await fetch(A+'/feedback',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();note(d.message||d.error,!r.ok)}health();me();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
