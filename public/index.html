<!doctype html><html lang="fr" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CV France v20</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><style>body{font-family:Arial;margin:0;background:#f6f7f9;color:#18212f}header{background:#111827;color:#fff;padding:18px}main{max-width:1100px;margin:auto;padding:20px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,button{padding:10px 14px;border:0;border-radius:10px;cursor:pointer}.nav button{background:#fff}.lang{background:#fbbf24;color:#111827;font-weight:700}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:14px 0}input,textarea,select{width:100%;padding:10px;margin:6px 0 12px;box-sizing:border-box;border:1px solid #ccc;border-radius:8px}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none}.ok{background:#e8fff3;padding:10px;border-radius:8px}.err{background:#ffe9e9;padding:10px;border-radius:8px}.muted{color:#667085}.primary{background:#111827;color:#fff}html[dir="rtl"] body{text-align:right}html[dir="rtl"] .nav{flex-direction:row-reverse}html[dir="rtl"] input,html[dir="rtl"] textarea,html[dir="rtl"] select{text-align:right}@media(max-width:800px){.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}}</style></head><body><header><div class="topbar"><div><h2>CV France <small>v20 Staging</small></h2><div class="nav"><button data-i18n="navHome" onclick="show('home')">Accueil</button><button data-i18n="navAccount" onclick="show('account')">Compte</button><button data-i18n="navCv" onclick="show('cv')">CV</button><button data-i18n="navLetters" onclick="show('letters')">Lettres</button><button data-i18n="navApps" onclick="show('apps')">Candidatures</button><button data-i18n="navFeedback" onclick="show('feedback')">Feedback</button></div></div><button class="lang" id="langBtn" onclick="toggleLang()">العربية</button></div></header><main><div id="banner"></div><section id="home"><div class="card"><h1 data-i18n="heroTitle">Votre recherche d'emploi, organisée.</h1><p class="muted" data-i18n="heroText">Créez vos CV, lettres et suivez vos candidatures. Cette page est la version staging v20.</p><p><span data-i18n="serverState">État serveur:</span> <strong id="health">chargement…</strong></p></div></section><section id="account" class="hidden"><div class="grid"><div class="card"><h3 data-i18n="createAccount">Créer un compte</h3><input id="regEmail" data-ph="email" placeholder="E-mail"><input id="regPass" type="password" data-ph="password" placeholder="Mot de passe"><input id="regInvite" data-ph="invite" placeholder="Code invitation"><button class="primary" data-i18n="create" onclick="register()">Créer</button></div><div class="card"><h3 data-i18n="loginTitle">Connexion</h3><input id="logEmail" data-ph="email" placeholder="E-mail"><input id="logPass" type="password" data-ph="password" placeholder="Mot de passe"><button class="primary" data-i18n="login" onclick="login()">Connexion</button><button data-i18n="logout" onclick="logout()">Déconnexion</button><p id="me" class="muted"></p></div></div></section><section id="cv" class="hidden"><div class="card"><h3 data-i18n="cvTitle">CV</h3><input id="cvTitle" data-ph="cvName" placeholder="Nom du CV"><input id="cvRole" data-ph="targetJob" placeholder="Métier recherché"><textarea id="cvProfile" data-ph="profile" placeholder="Profil professionnel"></textarea><textarea id="cvExperience" data-ph="experience" placeholder="Expériences"></textarea><textarea id="cvSkills" data-ph="skills" placeholder="Compétences"></textarea><button class="primary" data-i18n="save" onclick="saveCv()">Enregistrer</button><div id="cvList"></div></div></section><section id="letters" class="hidden"><div class="card"><h3 data-i18n="letterTitle">Lettre</h3><input id="letterTitle" data-ph="title" placeholder="Titre"><input id="letterCompany" data-ph="company" placeholder="Entreprise"><input id="letterRole" data-ph="position" placeholder="Poste"><textarea id="letterContent" data-ph="content" placeholder="Contenu"></textarea><button class="primary" data-i18n="save" onclick="saveLetter()">Enregistrer</button><div id="letterList"></div></div></section><section id="apps" class="hidden"><div class="card"><h3 data-i18n="applicationTitle">Candidature</h3><input id="appCompany" data-ph="company" placeholder="Entreprise"><input id="appRole" data-ph="position" placeholder="Poste"><select id="appStatus"><option data-i18n-option="sent">Envoyée</option><option data-i18n-option="interview">Entretien</option><option data-i18n-option="followup">Relance</option><option data-i18n-option="rejected">Refus</option><option data-i18n-option="accepted">Acceptée</option></select><button class="primary" data-i18n="add" onclick="saveApp()">Ajouter</button><div id="appList"></div></div></section><section id="feedback" class="hidden"><div class="card"><h3 data-i18n="feedbackTitle">Feedback bêta</h3><select id="fbRating"><option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option></select><select id="fbCategory"><option value="general" data-i18n-option="general">Général</option><option value="bug">Bug</option><option value="idea" data-i18n-option="idea">Idée</option><option value="design">Design</option><option value="payment" data-i18n-option="payment">Paiement</option><option value="ai" data-i18n-option="ai">IA</option></select><textarea id="fbMessage" data-ph="feedback" placeholder="Votre retour"></textarea><button class="primary" data-i18n="send" onclick="sendFeedback()">Envoyer</button></div></section></main><script>const A='/api';let token=localStorage.getItem('cvf_token')||'';let lang=localStorage.getItem('cvf_lang')||'fr';const $=id=>document.getElementById(id),v=id=>$(id).value.trim(),H=()=>token?{Autho (T[lang].accountCreated);me()}async function login(){let r=await fetch(A+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:v('logEmail'),password:v('logPass')})}),d=await r.json();if(!r.ok)return note(d.error,true);token=d.token;localStorage.setItem('cvf_token',token);note(T[lang].connected);me()}function logout(){token='';localStorage.removeItem('cvf_token');$('me').textContent=T[lang].notConnected}async function me(){if(!token){$('me').textContent=T[lang].notConnected;return}let r=await fetch(A+'/me',{headers:H()});if(!r.ok)return logout();let d=await r.json();$('me').textContent=d.user.email+' — '+d.user.plan}async function saveCv(){let body={title:v('cvTitle')||'Mon CV',targetRole:v('cvRole'),data:{jobTitle:v('cvRole'),profile:v('cvProfile'),experience:v('cvExperience'),skills:v('cvSkills')}};let r=await fetch(A+'/cvs',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return note(d.error,true);note(T[lang].cvSaved);loadCvs()}async function loadCvs(){if(!token)return;$('cvList').innerHTML='';let r=await fetch(A+'/cvs',{headers:H()}),d=await r.json();if(r.ok)$('cvList').innerHTML=d.cvs.map(x=>'<p><b>'+x.title+'</b> — '+(x.target_role||'')+'</p>').join('')}async function saveLetter(){let body={title:v('letterTitle')||'Lettre',company:v('letterCompany'),targetRole:v('letterRole'),content:v('letterContent')};let r=await fetch(A+'/letters',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return note(d.error,true);note(T[lang].letterSaved);loadLetters()}async function loadLetters(){if(!token)return;let r=await fetch(A+'/letters',{headers:H()}),d=await r.json();if(r.ok)$('letterList').innerHTML=d.letters.map(x=>'<p><b>'+x.title+'</b> — '+(x.company||'')+'</p>').join('')}async function saveApp(){let body={company:v('appCompany'),role:v('appRole'),status:v('appStatus')};let r=await fetch(A+'/applications',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)return note(d.error,true);note(T[lang].appSaved);loadApps()}async function loadApps(){if(!token)return;let r=await fetch(A+'/applications',{headers:H()}),d=await r.json();if(r.ok)$('appList').innerHTML=d.applications.map(x=>'<p><b>'+x.company+'</b> — '+x.role+' — '+x.status+'</p>').join('')}async function sendFeedback(){let body={rating:Number(v('fbRating')),category:v('fbCategory'),message:v('fbMessage'),page:location.pathname};let r=await fetch(A+'/feedback',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();note(d.message||d.error,!r.ok)}applyLang();health();me();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
