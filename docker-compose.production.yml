services:
  app:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      PORT: 3000
      APP_STAGE: production
      DATA_DIR: /app/data
      BACKUP_DIR: /app/data/backups
    volumes: [app_data:/app/data]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN}
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
  caddy_data:
  caddy_config:
